<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <title>haunted_terminal</title>
<style>

body{
    background: black;
    color:#1ff655;
    font-family: monospace;
    font-size: 16px;
    padding: 20px;
    margin:0;
    overflow-x:hidden;
}

#log {
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 75vh;
    overflow-y: auto;
    margin-bottom: 10px;
}
.dim{color:#1ff655 }
.warn { color:#ff4444; }
.ghost {
    color: #888;
    font-style:italic;
}
#inputRow {display:flex; }
#prompt {
    margin-right: 6px;
    white-space: nowrap;
}
#cmdInput {
    background: transparent;
    border: none;
    outline: none;
    color: #39ff6a;
    font-family : monospace;
    font-size: 16px;
    flex: 1;
}


.shake { animation: shakeAnim .4s linear;}
@keyframes shakeAnim {
    0%,100% {transform: translate(0,0); }
    25% {transform: translate(4px,-3px); }
    50% { transform: translate(-4px,3px);}
    75% { transform: translate(3px,2px);}
}
.dread {
    animation: dreadFlicker 2.5s infinite;
}
@keyframes dreadFlicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: .4; }
    98% {opacity: 1; }
    99% {opacity: .6; }
}
#scare {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    align-items: center;
    z-index: 999; 
    justify-content: center;
}
#scare.show{display: flex;}
#scareFace {
    font-size: 130px;
    color: red;
    text-align: center;
    line-height: 1;
    animation: scareFlicker .06s steps(1) infinite;
}
@keyframes scareFlicker {
    0% { transform: scale(1) translate(0,0); opacity: 1; }
    40% {transform: scale(1.05) translate(0,0); opacity: 0.85;}
}
#scare.white {background: white; }

#figureOverlay {
    position: fixed;
    inset: 0;
    background: #04120a;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 998;
    opacity: 0;
    transition: opacity 1.2s ease;
}
#figureOverlay.show { display: flex; opacity: 1; }
#figureOverlay.blackout {background: black; }
#figureOverlay .grain {
    position: absolute;
    inset : 0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 2px);
    pointer-events: none;
}
#figTimestamp {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #7fff9f;
    font-family: monospace;
    font-size: 14px;
    opacity: 0.8;
}
#figImgWrap {
    position: absolute;
    width: 400px;
    max-width: 84vw;
    padding: 14px;
    box-sizing: border-box;
    background-color: rgba(0, 0, 0, 0.25);
}
#figImgWrap img {
    width: 100%;
    display: block;
    image-rendering: auto;
    filter: brightness(1.1) contrast(1.25) sepia(0.3) hue-rotate(60deg) saturate(1.5) drop-shadow(0 0 18px rgba(120,255,170,0.25));
    animation: figPulse 3.2s ease-in-out infinite;
}
@keyframes figPulse {
    0%, 100% { filter: brightness(1.0) contrast(1.25) sepia(0.3) hue-rotate(60deg) saturate(1.5) drop-shadow(0 0 26px rgba(120,255,170,0.35)); }
}
.figCorner {
    position: absolute;
    width: 26px;
    height: 26px;
    border-color: rgba(140, 255, 175, 0.85);
    border-style: solid;
    border-width: 0;
}
.figCorner.tl {top: 4px; border-top-width: 3px; border-left-width: 3px;}
.figCorner.tr {top: 4px; right: 4px; border-top-width: 3px; border-right-width: 3px; }
.figCorner.bl {bottom: 4px; left: 4px; border-bottom-width: 3px; border-left-width: 3px; }
.figCorner.br {bottom: 4px; right: 4px; border-bottom-width: 3px; border-right-width: 3px;}
#caption {
    position: absolute;
    bottom: 60px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    font-family: monospace;
    font-size: 18px;
    opacity: 0;
    transition: opacity 0.4s ease;
    padding: 0 20px;
}
#caption.show {opacity: 1; }


#ipScreen {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 1000;
    font-family: monospace;
    color: #39ff6a;
    text-align: center;
    transform-origin: center center;
}
#ipScreen.show { display: flex; }
#ipQuestion {
    font-size: 26px;
    letter-spacing: 2px;
    animation: ipBlink 1.1s steps(1) infinite;
}
#ipAddress {
    font-size: 34px;
    letter-spacing: 6px;
    color: #7fff9f;
    filter: blur(4px);
    text-decoration: line-through;
    text-decoration-color: #39ff6a;
    text-decoration-thickness: 4px;
    animation: ipBlink 1.1s steps(1) infinite 0.35s;
}
@keyframes ipBlink {
    0%, 49% { opacity: 1;}
    50%, 100% { opacity: 0;}
}
#ipScreen.collapseY {
    transition: transform 0.3s cubic-bezier(0.4, 0, 1, 1);
    transform: scaleY(0.006);
}
#ipScreen.collapseX {
    transition: transform 0.24s cubic-bezier(0.4, 0, 1, 1);
    transform : scaleY(0.006) scaleX(0.01);
}
#ipScreen.collapseDot {
    transition: opacity 0.2s linear;
    opacity: 0;
}
</style>
</head>

function addLine(text, cls) {
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    logDiv.appendChild(d);
    logDiv.scrollTop = logDiv.scrollHeight;
    return d;
}

function typeLine(text, cls, speed) {
    return new Promise(function(resolve){
        var d = document.createElement('div');
        d.className = 'line' + (cls ?' ' + cls : ' ');
        logDiv.appendChild(d);
        var i = 0;
        var sp = speed || 16;
        var iv = setInterval(function(){
            d.textContent = d.textContent + text.charAt(i);
            i = i +1;
            logDiv.scrollTop = logDiv.scrollHeight;
            if(i >= text.length){
                clearInterval(iv);
                resolve();
            }
        }, sp);
    });
}

async function typeLines(arr, cls, speed) {
    for (var i = 0; i< arr.length; i++) {
        await typeLine(arr[i], cls, speed);
    }
}

function wait(ms){
    return new Promise(function(res){ setTimeout(res, ms) });
}

function shakeScreen(){
    document.body.classList.add('shake');
    setTimeout(function(){
        document.body.classList.remove('shake');
    }, 400);
}


var audioCtx = null;
function getCtx(){
    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

var droneOsc = null;
var droneGain = null;
function startDrone() {
    if (droneOsc) return; 
    var ctx = getCtx();
    droneOsc = ctx.createOscillator();
    droneGain = ctx.createGain();
    droneGain.gain.value = 0.045;
    droneOsc.type = 'sine';
    droneOsc.frequency.value = 45;
    droneOsc.connect(droneGain);
    droneGain.connect(ctx.destination);
    droneOsc.start();
}
function updateDrone(){
    if (!droneOsc) return;
    var ctx = getCtx();
    droneGain.gain.setTargetAtTime(0.045 + scareLevel * 0.014, ctx.currentTime, 1);
}
function stopDroneTemporarily(){
    if(droneGain){
        droneGain.gain.setTargetAtTime(0, getCtx().currentTime, 0.3);
    }
}
function resumeDrone(){
    updateDrone();
}

function stinger(){
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 200;
    gain.gain.value = 0.2;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
}

function bigScareSound() {
    var ctx = getCtx();
    var bufferSize = ctx.sampleRate * 0.7; 
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i=0; i<bufferSize; i++) {
        data[i] = (Math.random()*2 - 1) * (1-i/bufferSize);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var gain = ctx.createGain();
    gain.gain.value = 0.7;
    noise.connect(gain);
    gain.connect(ctx.destination);
    noise.start();

    var osc = ctx.createOscillator();
    var oscGain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(60, ctx.currentTime);
    osc.connect(oscGain);
    oscGain.gain.value = 0.3;
    oscGain.connect(ctx.destination);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
}

function powerDownSound(){
    var ctx = getCtx();

    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.65);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.7);

    var thumpOsc = ctx.createOscillator();
    var thumpGain = ctx.createGain();
    thumpOsc.type = 'sine';
    thumpOsc.frequency.setValueAtTime(90, ctx.currentTime + 0.55);
    thumpGain.gain.setValueAtTime(0.35, ctx.currentTime + 0.55);
    thumpGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
    thumpOsc.connect(thumpGain);
    thumpGain.connect(ctx.destination);
    thumpOsc.start(ctx.currentTime + 0.55);
    thumpOsc.stop(ctx.currentTime + 0.95);
}

function smallScareSound (){
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'triangle' ;
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
    gain.gain.value = 0.25;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5)
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
}

function dreadSwell() {
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 55;
    gain.gain.value = 0.0001;
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 3.5);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 5.1);
}

var ghostPool = [];
function nextGhostLine(){
    if(ghostPool.length == 0){
        ghostPool = ghostLines.slice();
        for(var i = ghostPool.length -1; i>0; i--){
            var j = Math.floor(Math.random() * (i+1));
            var tmp = ghostPool[i];
            ghostPool[i] = ghostPool[j];
            ghostPool[j] = tmp;
        }
    }
    return ghostPool.pop();
}

var ambientTimer = null;
function scheduleAmbient() {
    clearTimeout(ambientTimer);
    var delay = 9000 + Math.random() * 10000

        if (figureOverlay.classList.contains('show')) {

        scareLevel++;

function playClimaxAudio() {
    return new Promise(function(resolve){
        var a = new Audio(climaxAudioSrc);
        a.volume = 1;
        a.onended = resolve;
        a.onerror = resolve;
        setTimeout(resolve, 4500);
        a.play().catch(resolve);
    });
}

async function cmdNext() {
    if (nextAvailable == false) {
        await typeLine('nothing to advance right now.', 'dim', 10);
        return;
    }
    nextUsed = true;
    clearTimeout(ambientTimer);
    stopDroneTemporarily();
    
    await typeLine('loading final frame...', 'dim', 20);
    await wait(700);

    figureOverlay.classList.add('show');
    await wait(1200);
    dreadSwell();
    await wait(3000);

    captionEl.textContent = 'what are you looking at, friend?';
    captionEl.classList.add('show');
    await playClimaxAudio();

    await wait(1200);

    await runShutdownSequence();}

async function runShutdownSequence() {
    clearTimeout(ambientTimer);
    input.disabled = true;
    if (droneGain) {
        droneGain.gain.setTargetAtTime(0, getCtx().currentTime, 0.5);
    }

    ipScreen.classList.add('show');
    await wait(2800);

    ipScreen.classList.add('collapseY');
    powerDownSound();
    await wait(320);
    ipScreen.classList.add('collapseX');
    await wait(260);
    ipScreen.classList.add('collapseDot');
    await wait(500);

    document.body.innerHTML = '';
    document.body.style.background = '#000'; 
}

async function cmdHelp() {
    await typeLines([
        'commands you can use:',
        '   help    - shows this list',
        '   whoami  - who you are logged in as',
        '   ls      - lists files in this folder',
        '   cat FILE- shows what is inside a file, ex: cat notes.txt',
        '   clear   - clears tje screen',
        '   restart - starts everythin over from scratch',
        '   exit    - tries to leave'
    ], 'dim', 8);
}
async function cmdWhoami() {
    await typeLine('visitor', null, 20);
    await wait(300);
    await typeLine('(That is what it says. it has said that for every session)')
}
async function cmdLs() {
    var names = Object.keys(files);
    await wait(200);
    await typeLines(names, null, 10);
    await typeLine('.hidden_watcher', 'ghost', 10);
}
async function cmdCat(filename) {
    if (!filename) {
        await typeLine('usage: cat File', 'dim', 10);
        return;
    }
    if (!files.hasOwnProperty(filename)) {
        await typeLine('cat: ' + filename + ': no such file or directory', 'dim', 10);
        return;
    }
    var f = files[filename];

    if (f.text == 'SPECIAL_TRIGGER') {
        await typeLine('cat: ' + filename, 'dim', 10);
        await wait(500);
        await typeLine('opening...', 'dim', 20);
        await wait(900);
        await doBigScare();
        return;
    }

    await typeLines(f.text.split('\n'), null, 10);

    if (f.unlocks && !files.hasOwnProperty(f.unlocks)) {
        await wait(400);
        await typeLine('(a new file just appeared: ' + f.unlocks + ')', 'ghost', 15);
        if (f.unlocks === 'diary.txt') {
            addFile('diary.txt', {
                text: 'day 1: moved in. place is fine. a little cold. \nday 4: keep hearing footsteps upstairs, nobody lives up there. \nday 9: found an old camera pointed at my bed. did not put it there. \nday 12: checked the footage. i am scared to look again.'
            });
        }
    }

if (f.onRead === 'enableNext') {
    nextAvailable = true;
    await wait(400);
    await typeLine('(type "next" to see the last frame, if you want to)', 'dim', 15);
}

if (f.finalScare) {
    await wait(600);
    await doSmallScare2();
    await wait(500);
    addFile('camera.txt', {
        text: 'timestamp 03:12am - empty room\ntimestamp 03:13am - empty room\n timestamp 03:14am - empty room, door is open now. i did not open it. \ntimestap 03:15am - something is standing at the foot of the bed\n timestamp 03:16am - there is one more frame saved after this one.',
        onRead: 'enableNext'
    });
    await typeLine('(A new file has just appeared: camera.txt)', 'ghost', 15);
}
}
var exitTries = 0;
async function cmdExit() {
    exitTries = exitTries + 1;
    if (exitTries == 1) {
        await typeLine('logging out...', 'dim', 15);
        await wait(500);
        await typeLine('connection refused.', 'warn', 20);
    }
    else if (exitTries == 2) {
        await typeLine('it is not going to let you leave that easily.', 'warn', 15);
    }
    else {
        scareLevel += 2;
        updateDrone();
        await typeLine('stop trying to leave.', 'warn', 20);
    }
}

async function cmdRestart() {
    await typeLine( 'restarting session...', 'dim', 15);
    await wait(500);
    location.reload();
}

async function handleCommand(raw) {
    var trimmed = raw.trim();
    addLine('visitor@haunted:~$ ' + raw);
    if (trimmed === '') {
        return;
    }

    commandCount++;
    clearTimeout(ambientTimer);
    scheduleAmbient();

    var parts = trimmed.split(' ');
    var cmd = parts[0].toLowerCase();
    var arg = parts[1];

    if (cmd == 'help') {
        await cmdHelp();
    } else if (cmd == 'whoami') {
        await cmdWhoami();
    } else if (cmd == 'ls') {
        await cmdLs();
    } else if (cmd == 'cat') {
        await cmdCat(arg);
    } else if (cmd == 'next') {
        await cmdNext();
    } else if (cmd == 'clear') {
        logDiv.innerHTML = '';
    } else if (cmd == 'restart') {
        await cmdRestart();
    } else if (cmd == 'exit') {
        await cmdExit();
    } else {
        await typeLine('command not found: ' + cmd + ' (type help for a list)', 'dim', 10);
    }
}

input.addEventListener('keydown', async function(e) {
    if (e.key ==='Enter') {
        var val = input.value;
        input.value = '';
        input.disabled = true;
        await handleCommand(val);
        input.disabled = false;
        input.focus();
    }
});

var fullscreenRequested = false;

function requestFullscreenOnce() {
    if (fullscreenRequested) return;

    var element = document.documentElement;

    if (element.requestFullscreen) {
        fullscreenRequested = true;

        element.requestFullscreen().catch(function(err) {
            fullscreenRequested = false;
            console.log("Fullscreen request failed:", err);
        });
    }
}

document.body.addEventListener('click', function() {
    input.focus();
    startDrone();
    requestFullscreenOnce();
});

var audioStarted = false;
input.addEventListener('keydown', function() {
    if (!audioStarted) {
        audioStarted = true;
        startDrone();
    }
    requestFullscreenOnce();
});

(async function boot (){
    await typeLines([
        'connecting...',
        'session started.',
        ''

    ], 'dim', 10);
    await typeLine('Type help to see what ypu can do.', null, 18);
    scheduleAmbient();
})();

</script>
