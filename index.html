<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>haunted_terminal</title>
<style>
body { background: black; color: #1ff655; font-family: monospace; font-size: 16px; padding: 20px; margin: 0; overflow-x: hidden; }
#log { white-space: pre-wrap; max-height: 75vh; overflow-y: auto; margin-bottom: 10px; }
#inputRow { display: flex; }
#cmdInput { background: transparent; border: none; outline: none; color: #39ff6a; font-family: monospace; font-size: 16px; flex: 1; }

/* the red and gray text colors */
.warn { color: #ff4444; }
.ghost { color: #888; font-style: italic; }

#scare { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: black; display: none; align-items: center; justify-content: center; z-index: 999; }
#scareFace { font-size: 130px; color: red; text-align: center; line-height: 1; }

#figureOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #04120a; display: none; align-items: center; justify-content: center; z-index: 998; opacity: 0; transition: opacity 1.2s; }
#figTimestamp { position: absolute; top: 20px; left: 20px; color: #7fff9f; font-size: 14px; }
#figImg { width: 400px; max-width: 84vw; filter: brightness(1.1) contrast(1.25) sepia(0.3) hue-rotate(60deg) saturate(1.5); }
#caption { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; color: white; font-size: 18px; opacity: 0; transition: opacity 0.4s; }

#ipScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: black; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 1000; color: #39ff6a; text-align: center; }
#ipQuestion { font-size: 26px; letter-spacing: 2px; animation: blink 1.1s steps(1) infinite; }
#ipAddress { font-size: 34px; letter-spacing: 6px; color: #7fff9f; filter: blur(4px); text-decoration: line-through; animation: blink 1.1s steps(1) infinite 0.35s; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div id="log"></div>
<div id="inputRow">
    <span>visitor@haunted:~$&nbsp;</span>
    <input id="cmdInput" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
</div>

<div id="scare"><div id="scareFace">👁<br>DON'T TURN AROUND</div></div>

<div id="figureOverlay">
    <div id="figTimestamp">CAM 04 // 03:17:02</div>
    <img id="figImg" alt="">
    <div id="caption">what are you looking at, friend?</div>
</div>

<div id="ipScreen">
    <div id="ipQuestion">IS THIS YOUR IP?</div>
    <div id="ipAddress">192.168.4.231</div>
</div>

<script>
// ------------------------------------------------------------
// PASTE YOUR BASE64 DATA HERE (copy from the old file)
// the image is the src="data:image/png;base64,..." from the <img id="figImg">
// the audio is the climaxAudioSrc string from the old script
// ------------------------------------------------------------
var imageData = "data:image/png;base64,PASTE_IMAGE_BASE64_HERE";
var audioData = "data:audio/mpeg;base64,PASTE_AUDIO_BASE64_HERE";

document.getElementById('figImg').src = imageData;

var log = document.getElementById('log');
var input = document.getElementById('cmdInput');

// story stuff
var scareLevel = 0;
var bigScareDone = false;
var smallScareDone = false;
var haveDiary = false;
var haveEnd = false;
var haveCamera = false;
var nextIsAllowed = false;
var overlayIsUp = false;
var climaxDone = false;
var exitCount = 0;

// sound stuff
var ctx = null;
var droneOsc = null;
var droneGain = null;

var ghostLines = [
    'the cursor moved on its own for a second.',
    'someone else is typing.',
    'why is the fan spinning faster',
    '.',
    '..',
    '...',
    'stop looking at the screen like that.',
    'it can see the reflection in your screen too, you know.',
    'did you lock the door earlier',
    'that noise again. upstairs.',
    'it is reading this over your shoulder',
    'you have been here longer than you think',
    'turn around, actually dont.',
    'the temperature just dropped in here',
    'something just brushed against the back of your chair',
    'your reflection was a little late blinking just now.',
    'it does not like that you keep trying',
    'this session has been open before. you were not the one who opened it',
    'keep your eyes on the screen. not the corner. the screen.',
    'the walls are breathing a little. thats normal here.'
];

// ------------------------------------------------------------
// ghost lines that show up by themselves
// ------------------------------------------------------------
var ambientTimer = null;
function ambient() {
    clearTimeout(ambientTimer);
    ambientTimer = setTimeout(function() {
        if (overlayIsUp == true) {
            ambient();
            return;
        }
        scareLevel = scareLevel + 1;
        if (droneGain != null) {
            droneGain.gain.value = 0.045 + scareLevel * 0.014;
        }

        // little beep
        if (ctx == null) { ctx = new AudioContext(); }
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'square';
        o.frequency.value = 200;
        g.gain.value = 0.2;
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.3);

        var n = Math.floor(Math.random() * ghostLines.length);
        log.innerHTML += '<div class="ghost">' + ghostLines[n] + '</div>';
        log.scrollTop = log.scrollHeight;
        ambient();
    }, 9000 + Math.random() * 10000);
}

// ------------------------------------------------------------
// the big scare from do_not_open.txt
// ------------------------------------------------------------
function bigScare() {
    if (bigScareDone == true) {
        return;
    }
    bigScareDone = true;
    clearTimeout(ambientTimer);

    // noise
    if (ctx == null) { ctx = new AudioContext(); }
    var len = ctx.sampleRate * 0.7;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buf;
    var ng = ctx.createGain();
    ng.gain.value = 0.7;
    noise.connect(ng);
    ng.connect(ctx.destination);
    noise.start();

    // low growl
    var growl = ctx.createOscillator();
    var gg = ctx.createGain();
    growl.type = 'sawtooth';
    growl.frequency.value = 60;
    gg.gain.value = 0.3;
    growl.connect(gg);
    gg.connect(ctx.destination);
    growl.start();
    growl.stop(ctx.currentTime + 0.5);

    document.getElementById('scare').style.display = 'flex';
    document.body.style.transform = 'translate(6px, -4px)';
    setTimeout(function() {
        document.body.style.transform = 'translate(-6px, 4px)';
    }, 100);
    setTimeout(function() {
        document.body.style.transform = 'translate(0px, 0px)';
        document.getElementById('scare').style.background = 'white';
        document.getElementById('scareFace').style.color = 'black';
    }, 200);
    setTimeout(function() {
        document.getElementById('scare').style.background = 'black';
        document.getElementById('scareFace').style.color = 'red';
    }, 300);
    setTimeout(function() {
        document.getElementById('scare').style.display = 'none';
    }, 900);
    setTimeout(function() {
        log.innerHTML += '<div class="warn">you should not have opened that.</div>';
        log.scrollTop = log.scrollHeight;
    }, 1300);
    setTimeout(function() {
        log.innerHTML += '<div>there is one more file now. type ls if you want to see it. you do not have to.</div>';
        log.scrollTop = log.scrollHeight;
        haveEnd = true;
        scareLevel = scareLevel + 3;
        ambient();
    }, 1800);
}

// ------------------------------------------------------------
// the small scare when you read the_end.txt
// ------------------------------------------------------------
function smallScare() {
    if (smallScareDone == true) {
        return;
    }
    smallScareDone = true;

    if (ctx == null) { ctx = new AudioContext(); }
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(300, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
    g.gain.value = 0.25;
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.5);

    document.body.style.transform = 'translate(4px, 3px)';
    setTimeout(function() {
        document.body.style.transform = 'translate(-4px, -3px)';
    }, 100);
    setTimeout(function() {
        document.body.style.transform = 'translate(0px, 0px)';
    }, 200);
    setTimeout(function() {
        log.innerHTML += '<div class="ghost">(wha- what was that)</div>';
        log.scrollTop = log.scrollHeight;
    }, 400);
    setTimeout(function() {
        haveCamera = true;
        log.innerHTML += '<div class="ghost">(A new file has just appeared: camera.txt)</div>';
        log.scrollTop = log.scrollHeight;
    }, 1200);
}

// ------------------------------------------------------------
// the shutdown at the very end
// ------------------------------------------------------------
function shutdown() {
    if (climaxDone == true) {
        return;
    }
    climaxDone = true;
    clearTimeout(ambientTimer);
    input.disabled = true;
    if (droneGain != null) {
        droneGain.gain.value = 0;
    }

    document.getElementById('ipScreen').style.display = 'flex';

    setTimeout(function() {
        document.getElementById('ipScreen').style.transition = 'transform 0.3s';
        document.getElementById('ipScreen').style.transform = 'scaleY(0.006)';

        // power down sound
        if (ctx == null) { ctx = new AudioContext(); }
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(1800, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.6);
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.65);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.7);

        // thump
        var t = ctx.createOscillator();
        var tg = ctx.createGain();
        t.type = 'sine';
        t.frequency.value = 90;
        tg.gain.setValueAtTime(0.35, ctx.currentTime + 0.55);
        tg.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
        t.connect(tg);
        tg.connect(ctx.destination);
        t.start(ctx.currentTime + 0.55);
        t.stop(ctx.currentTime + 0.95);
    }, 2800);

    setTimeout(function() {
        document.getElementById('ipScreen').style.transform = 'scaleY(0.006) scaleX(0.01)';
    }, 3120);

    setTimeout(function() {
        document.getElementById('ipScreen').style.opacity = '0';
    }, 3380);

    setTimeout(function() {
        document.body.innerHTML = '';
        document.body.style.background = 'black';
    }, 3900);
}

// ------------------------------------------------------------
// the "next" command, final frame
// ------------------------------------------------------------
function goNext() {
    if (nextIsAllowed == false) {
        log.innerHTML += '<div>nothing to advance right now.</div>';
        return;
    }
    clearTimeout(ambientTimer);
    input.disabled = true;
    if (droneGain != null) {
        droneGain.gain.value = 0;
    }
    log.innerHTML += '<div>loading final frame...</div>';

    setTimeout(function() {
        overlayIsUp = true;
        document.getElementById('figureOverlay').style.display = 'flex';
        setTimeout(function() {
            document.getElementById('figureOverlay').style.opacity = '1';
        }, 50);
    }, 700);

    // dread swell
    setTimeout(function() {
        if (ctx == null) { ctx = new AudioContext(); }
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 55;
        g.gain.value = 0.0001;
        g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 3.5);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 5);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 5.1);
    }, 1900);

    // caption + voice line, then shutdown
    setTimeout(function() {
        document.getElementById('caption').style.opacity = '1';
        var voice = new Audio(audioData);
        voice.onended = function() {
            setTimeout(function() {
                shutdown();
            }, 1200);
        };
        voice.onerror = function() {
            shutdown();
        };
        voice.play();
        // in case the audio never finishes
        setTimeout(function() {
            shutdown();
        }, 6000);
    }, 4900);
}

// ------------------------------------------------------------
// typing commands
// ------------------------------------------------------------
input.addEventListener('keydown', function(e) {
    // start the drone the first time you type
    if (droneOsc == null) {
        if (ctx == null) { ctx = new AudioContext(); }
        droneOsc = ctx.createOscillator();
        droneGain = ctx.createGain();
        droneGain.gain.value = 0.045;
        droneOsc.type = 'sine';
        droneOsc.frequency.value = 45;
        droneOsc.connect(droneGain);
        droneGain.connect(ctx.destination);
        droneOsc.start();
    }

    if (e.key != 'Enter') {
        return;
    }

    var text = input.value;
    input.value = '';
    log.innerHTML += '<div>visitor@haunted:~$ ' + text + '</div>';
    if (text.trim() == '') {
        return;
    }

    // reset the ghost timer since they did something
    ambient();

    var words = text.trim().split(' ');
    var cmd = words[0].toLowerCase();
    var arg = words[1];

    if (cmd == 'help') {
        log.innerHTML += '<div>commands you can use:</div>';
        log.innerHTML += '<div>   help    - shows this list</div>';
        log.innerHTML += '<div>   whoami  - who you are logged in as</div>';
        log.innerHTML += '<div>   ls      - lists files in this folder</div>';
        log.innerHTML += '<div>   cat FILE- shows what is inside a file, ex: cat notes.txt</div>';
        log.innerHTML += '<div>   clear   - clears the screen</div>';
        log.innerHTML += '<div>   restart - starts everything over from scratch</div>';
        log.innerHTML += '<div>   exit    - tries to leave</div>';
    }
    else if (cmd == 'whoami') {
        log.innerHTML += '<div>visitor</div>';
        setTimeout(function() {
            log.innerHTML += '<div>(That is what it says. it has said that for every session)</div>';
            log.scrollTop = log.scrollHeight;
        }, 500);
    }
    else if (cmd == 'ls') {
        log.innerHTML += '<div>notes.txt</div>';
        log.innerHTML += '<div>todo.txt</div>';
        log.innerHTML += '<div>do_not_open.txt</div>';
        if (haveDiary == true) {
            log.innerHTML += '<div>diary.txt</div>';
        }
        if (haveEnd == true) {
            log.innerHTML += '<div>the_end.txt</div>';
        }
        if (haveCamera == true) {
            log.innerHTML += '<div>camera.txt</div>';
        }
        log.innerHTML += '<div class="ghost">.hidden_watcher</div>';
    }
    else if (cmd == 'cat') {
        if (arg == undefined) {
            log.innerHTML += '<div>usage: cat File</div>';
        }
        else if (arg == 'notes.txt') {
            log.innerHTML += '<div>reminder: the flickering light is probably just a bulb.</div>';
            log.innerHTML += '<div>probably.</div>';
            log.innerHTML += '<div>also, i think i left my diary open on this computer. should close that.</div>';
            if (haveDiary == false) {
                haveDiary = true;
                setTimeout(function() {
                    log.innerHTML += '<div class="ghost">(a new file just appeared: diary.txt)</div>';
                    log.scrollTop = log.scrollHeight;
                }, 600);
            }
        }
        else if (arg == 'todo.txt') {
            log.innerHTML += '<div>1. fix the light</div>';
            log.innerHTML += '<div>2. figure out the noise upstairs</div>';
            log.innerHTML += '<div>3. stop reading this at 3am</div>';
            log.innerHTML += '<div>4. check the camera app, it keeps saying motion detected and nobody is home</div>';
        }
        else if (arg == 'diary.txt' && haveDiary == true) {
            log.innerHTML += '<div>day 1: moved in. place is fine. a little cold.</div>';
            log.innerHTML += '<div>day 4: keep hearing footsteps upstairs, nobody lives up there.</div>';
            log.innerHTML += '<div>day 9: found an old camera pointed at my bed. did not put it there.</div>';
            log.innerHTML += '<div>day 12: checked the footage. i am scared to look again.</div>';
        }
        else if (arg == 'do_not_open.txt') {
            log.innerHTML += '<div>cat: do_not_open.txt</div>';
            log.innerHTML += '<div>opening...</div>';
            setTimeout(function() {
                bigScare();
            }, 900);
        }
        else if (arg == 'the_end.txt' && haveEnd == true) {
            log.innerHTML += '<div>if you are reading this, you stayed the whole time.</div>';
            log.innerHTML += '<div>that is more than the last one did.</div>';
            log.innerHTML += '<div>goodnight.</div>';
            setTimeout(function() {
                smallScare();
            }, 600);
        }
        else if (arg == 'camera.txt' && haveCamera == true) {
            log.innerHTML += '<div>timestamp 03:12am - empty room</div>';
            log.innerHTML += '<div>timestamp 03:13am - empty room</div>';
            log.innerHTML += '<div>timestamp 03:14am - empty room, door is open now. i did not open it.</div>';
            log.innerHTML += '<div>timestamp 03:15am - something is standing at the foot of the bed</div>';
            log.innerHTML += '<div>timestamp 03:16am - there is one more frame saved after this one.</div>';
            nextIsAllowed = true;
            setTimeout(function() {
                log.innerHTML += '<div>(type "next" to see the last frame, if you want to)</div>';
                log.scrollTop = log.scrollHeight;
            }, 400);
        }
        else {
            log.innerHTML += '<div>cat: ' + arg + ': no such file or directory</div>';
        }
    }
    else if (cmd == 'next') {
        goNext();
    }
    else if (cmd == 'clear') {
        log.innerHTML = '';
    }
    else if (cmd == 'restart') {
        log.innerHTML += '<div>restarting session...</div>';
        setTimeout(function() {
            location.reload();
        }, 500);
    }
    else if (cmd == 'exit') {
        exitCount = exitCount + 1;
        if (exitCount == 1) {
            log.innerHTML += '<div>logging out...</div>';
            setTimeout(function() {
                log.innerHTML += '<div class="warn">connection refused.</div>';
                log.scrollTop = log.scrollHeight;
            }, 500);
        }
        else if (exitCount == 2) {
            log.innerHTML += '<div class="warn">it is not going to let you leave that easily.</div>';
        }
        else {
            scareLevel = scareLevel + 2;
            log.innerHTML += '<div class="warn">stop trying to leave.</div>';
        }
    }
    else {
        log.innerHTML += '<div>command not found: ' + cmd + ' (type help for a list)</div>';
    }

    log.scrollTop = log.scrollHeight;
});

document.body.addEventListener('click', function() {
    input.focus();
});

// ------------------------------------------------------------
// start
// ------------------------------------------------------------
log.innerHTML += '<div>connecting...</div>';
setTimeout(function() {
    log.innerHTML += '<div>session started.</div>';
}, 600);
setTimeout(function() {
    log.innerHTML += '<div>Type help to see what you can do.</div>';
    ambient();
}, 1200);
</script>
</body>
</html>
